<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vorübergehend nicht erreichbar</title>
<style>
  /* Alles inline: Die Seite wird unter beliebigen URLs ausgeliefert. */
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #5b6475;
    --accent: #475569;
    --accent-bg: #eef1f5;
    --border: #e3e6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b1f29;
      --text: #e8ebf1;
      --muted: #a2aabb;
      --accent: #c3cad6;
      --accent-bg: #252b37;
      --border: #2c3240;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge svg { width: 16px; height: 16px; }
  h1 {
    margin: 18px 0 12px;
    font-size: 1.6rem;
    line-height: 1.25;
  }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 0.92rem; }
  hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 24px 0 18px;
  }
  @media (max-width: 480px) {
    main { padding: 28px 20px; }
    h1 { font-size: 1.35rem; }
  }
</style>
</head>
<body>
<main>
  <span class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><polyline points="12 7 12 12 15.5 14"/></svg>
    Wartungsarbeiten
  </span>

  <h1>Diese Seite ist vorübergehend nicht erreichbar</h1>

  <p>Dieses Angebot ist derzeit wegen technischer Arbeiten abgeschaltet.</p>

  <p>Wir arbeiten daran, die Seite so schnell wie möglich wieder bereitzustellen. Bitte schauen Sie später noch einmal vorbei.</p>

  <hr>

  <p class="muted">Vielen Dank für Ihr Verständnis.</p>
</main>
</body>
</html>
