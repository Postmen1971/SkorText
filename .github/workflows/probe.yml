name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections
          E = "https://site.api.espn.com/apis/site/v2/sports/soccer"
          S = "https://site.api.espn.com/apis/v2/sports/soccer"
          codes = ["ger.1","ger.2","ger.3","ger.dfb_pokal","tur.1","tur.2","tur.cup","eng.1","esp.1","ita.1","fra.1","uefa.champions","uefa.europa","uefa.europa.conf","uefa.nations","fifa.worldq.uefa","uefa.euroq","fifa.friendly","ger.4.sw","ger.regionalliga"]
          for c in codes:
              try:
                  r = requests.get("%s/%s/scoreboard?dates=20260801-20270630&limit=1000" % (E, c), headers=H, timeout=25)
                  n = len(r.json().get("events", [])) if r.status_code == 200 else -1
                  t = requests.get("%s/%s/standings" % (S, c), headers=H, timeout=25)
                  tn = 0
                  if t.status_code == 200:
                      tj = t.json()
                      for ch in tj.get("children", []) or [tj]:
                          tn += len(((ch.get("standings") or {}).get("entries")) or [])
                  OUT.append(print_("ESPN", c, "events", r.status_code, n, len(r.text), "| table", t.status_code, tn))
                  if c in ("ger.1", "uefa.nations") and r.status_code == 200:
                      open("samples/espn_%s.json" % c, "w").write(r.text)
                      open("samples/espn_tab_%s.json" % c, "w").write(t.text)
              except Exception as ex:
                  OUT.append(print_("ERR", c, ex))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/espn_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
