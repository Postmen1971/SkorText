name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          path: repo0
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections, time
          def get(u):
              try:
                  r = requests.get(u, headers=H, timeout=30); return r.status_code, r.text
              except Exception as e: return 0, str(e)
          LS = "https://prod-public-api.livescore.com/v1/api/app"
          for path in ["holland/eredivisie", "netherlands/eredivisie", "portugal/primeira-liga", "belgium/belgian-pro-league-2025", "belgium/belgian-pro-league", "scotland/scotland-premiership",
                       "austria/bundesliga", "switzerland/super-league", "greece/super-league", "england/championship", "spain/laliga-2", "italy/serie-b", "france/ligue-2", "denmark/superliga"]:
              s, t = get(LS + "/stage/soccer/%s/0?MD=1" % path)
              try:
                  j = json.loads(t); st = (j.get("Stages") or [{}])[0]
                  tb = (((st.get("LeagueTable") or {}).get("L") or [{}])[0].get("Tables") or [{}])[0].get("team") or []
                  OUT.append(print_(path, s, st.get("Snm"), st.get("Cnm"), len(st.get("Events") or []), "Tabelle", len(tb)))
              except Exception: OUT.append(print_(path, s, t[:80]))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/nl_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
