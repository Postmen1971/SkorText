name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          path: repo0
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections, time
          def get(u):
              try:
                  r = requests.get(u, headers=H, timeout=25); return r.status_code, r.text, r.headers.get("content-type", "")
              except Exception as e: return 0, str(e), ""
          for pg in ["101", "250", "251", "210", "520", "300", "999", "201&dir=fwd", "199&dir=bck"]:
              s, t, ct = get("https://www.ard-text.de/index.php?page=" + pg)
              ids = re.findall(r"<div id='(page_\d+)'>", t)
              i = t.find("<div id='page_1'>")
              rows = re.findall(r"<div><span", t[i:]) if i >= 0 else []
              OUT.append(print_(pg, s, len(t), ids, "rows", len(rows), "counter", re.findall(r'subpageCounter">([^<]*)<', t), re.findall(r"img/(g\d[a-z]+)[0-9a-f]{2}\.gif", t)[:3] and sorted(set(re.findall(r"img/(g\d[a-z]+)[0-9a-f]{2}\.gif", t)))))
              if pg in ("250", "101"): open("samples/ttx_ard%s.html" % pg, "w").write(t)
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/ttx_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
