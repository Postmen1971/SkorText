name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections
          B = "https://prod-public-api.livescore.com/v1/api/app"
          UAS = {"chrome": H["User-Agent"], "android": "Dalvik/2.1.0 (Linux; U; Android 11; SHIELD Android TV Build/RQ1A.210105.003)",
                 "okhttp": "okhttp/4.9.0", "python": "python-requests/2.31", "none": ""}
          for u in ["stage/soccer/france/ligue-1/0?MD=1", "live/soccer/0?MD=1", "stage/soccer/germany/bundesliga/0?MD=1"]:
              for name, ua in UAS.items():
                  for extra in [{}, {"Accept-Encoding": "gzip"}, {"Origin": "https://www.livescore.com", "Referer": "https://www.livescore.com/"}]:
                      try:
                          h = {"Accept": "application/json, */*"}
                          if ua: h["User-Agent"] = ua
                          h.update(extra)
                          r = requests.get("%s/%s" % (B, u), headers=h, timeout=20)
                          OUT.append(print_("LS", u[:30], name, list(extra.keys()), r.status_code, len(r.text), r.headers.get("server"), r.text[:80].replace("\n"," ") if r.status_code != 200 else ""))
                      except Exception as ex:
                          OUT.append(print_("ERR", u, name, ex))
          for u in ["https://prod-cdn-public-api.livescore.com/v1/api/app/stage/soccer/france/ligue-1/0?MD=1",
                    "https://prod-cdn-mev-api.livescore.com/v1/api/app/stage/soccer/france/ligue-1/0?MD=1",
                    "https://prod-public-api.livescore.com/v1/api/react/stage/soccer/france/ligue-1/0?MD=1"]:
              try:
                  r = requests.get(u, headers=H, timeout=20); OUT.append(print_("ALT", u, r.status_code, len(r.text)))
              except Exception as ex:
                  OUT.append(print_("ERR", u, ex))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/* repo/samples/ || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
