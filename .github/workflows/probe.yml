name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          path: repo0
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections, time, sys
          sys.path.insert(0, "repo0/enigma2/usr/lib/enigma2/python/Plugins/Extensions/SkorText")
          import types; pk = types.ModuleType("sk"); pk.__path__ = ["repo0/enigma2/usr/lib/enigma2/python/Plugins/Extensions/SkorText"]; sys.modules["sk"] = pk
          import importlib; news = importlib.import_module("sk.news")
          for u in ["https://www.haberler.com/kahramanmaras/rss", "https://rss.haberler.com/rss.asp?kategori=kahramanmaras", "https://www.haberler.com/rss/kahramanmaras.xml",
                    "https://www.ntv.com.tr/kahramanmaras.rss", "https://www.ntv.com.tr/haberleri/kahramanmaras.rss", "https://www.trthaber.com/etiket/kahramanmaras.rss",
                    "https://www.dha.com.tr/rss/kahramanmaras", "https://www.iha.com.tr/rss/kahramanmaras", "https://www.iha.com.tr/kahramanmaras-haberleri/rss",
                    "https://www.milliyet.com.tr/rss/rssnew/kahramanmaras", "https://www.kahramanmarasmanset.com/rss", "https://www.marassonsoz.com/rss",
                    "https://www.marasgundem.com/rss", "https://www.kahramanmarashaber.com/rss", "https://www.kahramanmarasgazetesi.com/rss", "https://www.bizimmaras.com/rss",
                    "https://www.kahramanmarasajans.com/rss", "https://www.marasolay.com/rss", "https://www.haber46.com.tr/rss", "https://www.kmaras.com/rss",
                    "https://www.marasmanset.com/rss", "https://www.kahramanmaraspostasi.com/rss",
                    "https://news.google.com/rss/search?q=Kahramanmara%C5%9F&hl=tr&gl=TR&ceid=TR:tr"]:
              try:
                  r = requests.get(u, headers=H, timeout=25); its = news.parse_feed(r.content)
                  OUT.append(print_(r.status_code, u, len(its), [(i["title"][:60], len(i["desc"]), i["desc"][:80], time.strftime("%d.%m %H:%M", time.gmtime(i["ts"]))) for i in sorted(its, key=lambda x: -x["ts"])[:2]]))
              except Exception as e: OUT.append(print_("ERR", u, str(e)[:80]))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/nl_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
