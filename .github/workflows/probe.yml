name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re
          for u in ["https://prod-public-api.livescore.com/v1/api/app/live/soccer/0?MD=1",
                    "https://prod-public-api.livescore.com/v1/api/app/stage/soccer/turkey/super-lig/0?MD=1",
                    "https://api.fupa.net/v1/standings?competition=verbandsliga-wuerttemberg&season=2026-27",
                    "https://api.frankfurter.dev/v1/latest?from=EUR&to=TRY",
                    "https://www.trthaber.com/manset_articles.rss",
                    "https://www.aa.com.tr/tr/rss/default?cat=guncel"]:
              for org in ["https://claude.ai", "https://example.github.io"]:
                  try:
                      h = dict(H); h["Origin"] = org
                      r = requests.get(u, headers=h, timeout=20)
                      o = requests.options(u, headers={"Origin": org, "Access-Control-Request-Method": "GET"}, timeout=20)
                      OUT.append(print_("CORS", r.status_code, "ACAO=", r.headers.get("Access-Control-Allow-Origin"), "| OPT", o.status_code, o.headers.get("Access-Control-Allow-Origin"), "|", org, u))
                  except Exception as ex:
                      OUT.append(print_("ERR", u, ex))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/* repo/samples/ || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
