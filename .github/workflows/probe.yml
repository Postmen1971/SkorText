name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          path: repo0
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections, time
          def get(u):
              try:
                  r = requests.get(u, headers=H, timeout=25); return r.status_code, r.text, r.headers.get("content-type", "")
              except Exception as e: return 0, str(e), ""
          s, t, ct = get("https://www.ard-text.de/index.php?page=210")
          for js in sorted(set(re.findall(r'src="([^"]+\.js[^"]*)"', t))):
              u = js if js.startswith("http") else "https://www.ard-text.de/" + js.lstrip("./")
              s2, t2, c2 = get(u)
              hits = [t2[max(0, m.start()-150):m.end()+150] for m in re.finditer(r"(?i)unterseite|subpage|sub=|ajax|\.php", t2)][:8]
              OUT.append(print_("JS", u, s2, len(t2), hits))
          def rows(t):
              i = t.find("<div id='page_1'>")
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t[i:i+20000]).replace("&nbsp;", " "))[:200]
          for q in ["210", "210&sub=2", "210&subpage=2", "210_02", "210-2", "210&s=2", "210/2"]:
              s, t, ct = get("https://www.ard-text.de/index.php?page=" + q)
              OUT.append(print_(q, s, re.findall(r'subpageCounter">([^<]*)<', t), rows(t)))
          s, t, ct = get("https://www.ard-text.de/mobil/210"); OUT.append(print_("mobil210", s, re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t))[-1500:]))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/ttx_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
