name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          path: repo0
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections, sys, time
          sys.path.insert(0, "repo0/enigma2/usr/lib/enigma2/python/Plugins/Extensions/SkorText")
          import data
          data.LS_STATE["pause"] = time.time() + 99999   # LiveScore gesperrt wie bei Aziz
          t0 = time.time(); data.NAT.load(); OUT.append(print_("LOAD", data.NAT.kind, len(data.NAT.groups), "%.1fs" % (time.time()-t0)))
          for lg in data.NAT.groups:
              OUT.append(print_(lg.name("de"), "| Spieltag", lg.round, "prev", lg.prev_round, "| alle", len(lg.all_events)))
              for e in lg.prev_events: OUT.append(print_("   ", e["h"], e["hs"], ":", e["as"], e["a"], e["state"]))
              for e in lg.events: OUT.append(print_("   >", time.strftime("%d.%m %H:%M", time.gmtime(e["ts"])), e["h"], "-", e["a"], e["state"]))
              for n, rows in lg.tables:
                  for r in rows: OUT.append(print_("     ", r["pos"], r["tm"], r["p"], r["gf"], ":", r["ga"], r["pts"]))
          t0 = time.time(); data.NAT.t_uefa_full = time.time(); data.NAT.load(); OUT.append(print_("LIVE-RELOAD %.1fs" % (time.time()-t0)))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/nl_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
