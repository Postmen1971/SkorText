name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections
          r = requests.get("https://www.tff.org/Default.aspx?pageID=288", headers=H, timeout=30)
          open("samples/tff_kupa.html", "w").write(r.text)
          OUT.append(print_("KUPA", r.status_code, len(r.text), re.findall(r'class="moduleTitle">([^<]+)<', r.text)))
          for m in re.finditer(r'pageI[Dd]=(\d+)[^"]*"[^>]*>\s*(?:<span[^>]*>)?([^<]{3,60})<', r.text):
              if re.search(r"(?i)tur|grup|kupa|final|2026", m.group(2)): OUT.append(print_("  LINK", m.group(1), m.group(2).strip()))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/tff_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
