name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json"}
          import datetime
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          import os
          os.makedirs("samples", exist_ok=True)
          for name, u in [("stage_super-lig", "stage/soccer/turkey/super-lig/0"), ("stage_white", "stage/soccer/turkey/2nd-lig-white-group/0"),
                          ("stage_bl1", "stage/soccer/germany/bundesliga/0"), ("stage_rlsw", "stage/soccer/germany/regionalliga-sudwest/0"),
                          ("live", "live/soccer/0")]:
              r = requests.get("https://prod-public-api.livescore.com/v1/api/app/%s?MD=1" % u, headers=H, timeout=20)
              open("samples/%s.json" % name, "w").write(r.text)
              OUT.append(print_("SAVED", name, r.status_code, len(r.text)))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && cp samples/*.json repo/samples/
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
