name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          path: repo0
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections, time
          def get(u):
              try:
                  r = requests.get(u, headers=H, timeout=30); return r.status_code, r.text
              except Exception as e: return 0, str(e)
          LS = "https://prod-public-api.livescore.com/v1/api/app"
          for cc in ["netherlands", "portugal", "belgium", "scotland", "austria", "switzerland", "greece", "england", "denmark", "spain", "italy", "germany", "poland", "czech-republic", "norway", "sweden"]:
              s, t = get(LS + "/category/soccer/%s/0?MD=1" % cc)
              try:
                  j = json.loads(t); OUT.append(print_("LS", cc, s, [(st.get("Scd"), st.get("Snm"), len(st.get("Events") or [])) for st in j.get("Stages", [])][:14]))
              except Exception: OUT.append(print_("LS", cc, s, t[:100]))
          for code in ["ned.1", "por.1", "bel.1", "sco.1", "aut.1", "sui.1", "gre.1", "eng.2", "den.1", "esp.2", "ita.2", "fra.2", "pol.1", "cze.1", "nor.1", "swe.1"]:
              s, t = get("https://site.api.espn.com/apis/v2/sports/soccer/%s/standings" % code)
              try:
                  j = json.loads(t); ch = j.get("children") or []
                  OUT.append(print_("ESPN", code, s, j.get("name"), [(c.get("name"), len((c.get("standings") or {}).get("entries") or [])) for c in ch]))
              except Exception: OUT.append(print_("ESPN", code, s, t[:100]))
              s, t = get("https://site.api.espn.com/apis/site/v2/sports/soccer/%s/scoreboard" % code)
              try:
                  j = json.loads(t); lg0 = (j.get("leagues") or [{}])[0]; OUT.append(print_("   SB", len(j.get("events", [])), lg0.get("calendarType"), len(lg0.get("calendar") or [])))
              except Exception: pass
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/nl_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
