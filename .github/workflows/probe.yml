name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections
          def get(u):
              try:
                  r = requests.get(u, headers=H, timeout=30); return r.status_code, r.text
              except Exception as e: return 0, str(e)
          def save(n, t): open("samples/nl_"+n, "w").write(t)
          s, t = get("https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.nations/scoreboard?dates=20260925"); save("espn_sb.json", t)
          j = json.loads(t); OUT.append(print_("CAL", json.dumps(j["leagues"][0].get("calendar"))[:3000]))
          s, t = get("https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.nations/scoreboard"); save("espn_sb0.json", t)
          OUT.append(print_("SB0", s, [e.get("date") for e in json.loads(t).get("events", [])][:20]))
          s, t = get("https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.nations/scoreboard?dates=20260901-20261130&limit=300"); save("espn_rng.json", t)
          OUT.append(print_("RNG", s, len(json.loads(t).get("events", [])) if s==200 else t[:200]))
          s, t = get("https://match.uefa.com/v5/matches?competitionId=2014&seasonYear=2027&limit=100&order=ASC&offset=0"); save("uefa_m.json", t)
          OUT.append(print_("UEFA-M", s, len(t)))
          s, t = get("https://standings.uefa.com/v1/standings?competitionId=2014&seasonYear=2027"); save("uefa_st.json", t)
          OUT.append(print_("UEFA-ST", s, len(t), t[:200]))
          s, t = get("https://prod-public-api.livescore.com/v1/api/app/category/soccer/uefa-nations-league/0?MD=1"); save("ls_cat.json", t)
          OUT.append(print_("LS", s, len(t)))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/nl_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
