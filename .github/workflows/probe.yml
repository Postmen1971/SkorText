name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          path: repo0
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections, time
          def get(u):
              try:
                  r = requests.get(u, headers=H, timeout=25); return r.status_code, r.text, r.headers.get("content-type", "")
              except Exception as e: return 0, str(e), ""
          for n, u in [("ard", "https://www.ard-text.de/"), ("ard100", "https://www.ard-text.de/index.php?page=100"), ("ard200", "https://www.ard-text.de/index.php?page=200"),
                       ("ardm", "https://www.ard-text.de/mobil/100"), ("zdf", "https://teletext.zdf.de/teletext/zdf/seiten/100.html"),
                       ("trt1", "https://teletext.trt.net.tr/"), ("trt2", "https://www.trt.net.tr/teletext"), ("trt3", "https://www.trt.net.tr/telegun"), ("trt4", "https://telegun.trt.net.tr/")]:
              s, t, ct = get(u)
              open("samples/ttx_%s.html" % n, "w").write(t)
              OUT.append(print_(n, s, ct, len(t), re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t))[:300]))
              OUT.append(print_("   links:", sorted(set(re.findall(r'(?:src|href)="([^"]+)"', t)))[:40]))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/ttx_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
