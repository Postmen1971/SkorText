name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import re
          U = [
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/standing",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/standings",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/matches",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/rounds",
            "https://api.fupa.net/v2/competitions/verbandsliga-wuerttemberg",
            "https://www.fupa.net/league/verbandsliga-wuerttemberg",
            "https://www.fupa.net/league/verbandsliga-wuerttemberg/standing",
            "https://api.fupa.net/v1/teams/1-goppinger-sv-m1-2026-27",
            "https://api.fupa.net/v1/clubs/1-goppinger-sv",
            "https://www.kicker.de/verbandsliga-wuerttemberg/tabelle",
            "https://www.kicker.de/verbandsliga-wuerttemberg/spieltag",
            "https://www.kicker.de/1-goeppinger-sv/info",
          ]
          for u in U:
              try:
                  r = requests.get(u, headers=H, timeout=20)
                  t = r.text
                  OUT.append(print_("SRC", r.status_code, len(t), u))
                  OUT.append("   " + re.sub(r"\s+", " ", t[:500]))
                  i = t.find("pping")
                  if i >= 0: OUT.append("   GOEPP@" + str(i) + ": " + re.sub(r"\s+", " ", t[max(0,i-200):i+200]))
                  if r.status_code == 200:
                      fn = "samples/" + re.sub(r"[^a-z0-9]+", "_", u.split("//")[1])[:80] + (".json" if t.lstrip().startswith(("{","[")) else ".html")
                      open(fn, "w").write(t)
              except Exception as ex:
                  OUT.append(print_("SRCERR", u, ex))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/*.json repo/samples/ || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
