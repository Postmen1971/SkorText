name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections
          B = "https://prod-public-api.livescore.com/v1/api/app"
          def get(u):
              return requests.get(u, headers=H, timeout=25)
          for c in ["uefa-nations-league", "world-cup-qualification", "euro-2024-qualification", "euro-2028-qualification", "uefa-nations-league-2022-2023"]:
              try:
                  r = get("%s/category/soccer/%s/0?MD=1" % (B, c))
                  OUT.append(print_("CAT", c, r.status_code, len(r.text)))
                  if r.status_code == 200:
                      for st in r.json().get("Stages", []):
                          ev = st.get("Events", [])
                          OUT.append(print_("   ", st.get("Scd"), "|", st.get("Snm"), "|", st.get("CompN"), "| n", len(ev), "|", min([e.get("Esd") for e in ev] or [0]), max([e.get("Esd") for e in ev] or [0]), "| LT" if st.get("LeagueTable") else ""))
              except Exception as ex:
                  OUT.append(print_("ERR", c, ex))
          for u in ["stage/soccer/world-cup-qualification/uefa-group-a/0", "stage/soccer/euro-2024-qualification/group-a/0"]:
              try:
                  r = get("%s/%s?MD=1" % (B, u)); OUT.append(print_("ST", u, r.status_code, len(r.text)))
              except Exception as ex:
                  OUT.append(print_("ERR", u, ex))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/* repo/samples/ || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
