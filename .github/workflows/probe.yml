name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections
          E = "https://site.api.espn.com/apis/site/v2/sports/soccer"
          S = "https://site.api.espn.com/apis/v2/sports/soccer"
          for c, q in [("ger.1", "?dates=20261024"), ("ger.1", "?dates=20261031"), ("ger.dfb_pokal", "?dates=20261028"), ("uefa.champions", "?dates=20261021"), ("tur.1", "?dates=20261025"), ("ger.1", "")]:
              r = requests.get("%s/%s/scoreboard%s" % (E, c, q), headers=H, timeout=25)
              OUT.append(print_("SB", c, q, r.status_code, len(r.text)))
              if r.status_code == 200: open("samples/espn_sb_%s_%s.json" % (c, q[7:] or "x"), "w").write(r.text)
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/espn_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
