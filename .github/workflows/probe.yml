name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          path: repo0
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections, sys, time
          sys.path.insert(0, "repo0/enigma2/usr/lib/enigma2/python/Plugins/Extensions/SkorText")
          import data
          data.LS_STATE["pause"] = time.time() + 99999   # LiveScore gesperrt wie bei Aziz
          for pg in (200, 210, 300, 400, 410):
              lg = data.STORE.league_by_page(pg)
              t0 = time.time()
              try:
                  lg.load()
              except Exception as e:
                  OUT.append(print_(pg, "FEHLER", e)); continue
              OUT.append(print_(pg, lg.source, "Spieltag", lg.round, "max", lg.max_round, "off", getattr(lg, "espn_off", "-"), "%.1fs" % (time.time()-t0)))
              for n in (1, lg.round - 3, lg.round + 2, lg.max_round):
                  ev = lg.events_of_round(n)
                  if ev is None:
                      lg.load_round(n); ev = lg.events_of_round(n)
                  OUT.append(print_("   MD", n, len(ev or []), [(e["h"], e["hs"], e["as"], e["a"], time.strftime("%d.%m", time.gmtime(e["ts"]))) for e in (ev or [])[:2]]))
          t0 = time.time(); data.NAT.load(); OUT.append(print_("NAT", data.NAT.kind, len(data.NAT.groups), "%.1fs" % (time.time()-t0)))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/nl_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
