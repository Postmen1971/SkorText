name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections
          B = "https://prod-public-api.livescore.com/v1/api/app"
          def get(u):
              return requests.get(u, headers=H, timeout=25)
          for name, u in [("fifa_api", "https://inside.fifa.com/api/ranking-overview?locale=en&dateId=FRS_Male_Football_20260720"),
                          ("fifa_api_de", "https://inside.fifa.com/api/ranking-overview?locale=de&dateId=FRS_Male_Football_20260720"),
                          ("cat_tr", B + "/category/soccer/turkey/0?MD=1"),
                          ("nl_a2", B + "/stage/soccer/uefa-nations-league/league-a-group-2/0?MD=1"),
                          ("dfb_r1", B + "/stage/soccer/germany/dfb-cup-round-1-2025-2026/0?MD=1"),
                          ("date_today", B + "/date/soccer/20261024/0?MD=1")]:
              try:
                  r = get(u); t = r.text
                  OUT.append(print_("API", name, r.status_code, len(t), t[:500].replace("\n", " ")))
                  if r.status_code == 200 and len(t) > 100: open("samples/x_%s.json" % name, "w").write(t)
              except Exception as ex:
                  OUT.append(print_("APIERR", name, ex))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/* repo/samples/ || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
