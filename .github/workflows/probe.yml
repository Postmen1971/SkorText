name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json"}
          import datetime
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          import os
          os.makedirs("samples", exist_ok=True)
          C = ["champions-league","europa-league","conference-league","europa-conference-league","uefa-champions-league","uefa-europa-league","uefa-conference-league"]
          S = ["league-stage","league-phase","group-stage","",]
          for c in C:
              for sc in S:
                  u = "stage/soccer/%s/%s/0" % (c, sc) if sc else "stage/soccer/%s/0" % c
                  try:
                      r = requests.get("https://prod-public-api.livescore.com/v1/api/app/%s?MD=1" % u, headers=H, timeout=20)
                      ok = r.status_code == 200 and '"Events"' in r.text
                      OUT.append(print_("TRY", u, r.status_code, len(r.text), ok))
                      if ok:
                          open("samples/uefa_%s_%s.json" % (c, sc or "x"), "w").write(r.text)
                  except Exception as ex:
                      OUT.append(print_("ERR", u, ex))
          for d in ["20261021","20261022","20261023"]:
              r = requests.get("https://prod-public-api.livescore.com/v1/api/app/date/soccer/%s/0?MD=1" % d, headers=H, timeout=20)
              try:
                  for st in r.json().get("Stages", []):
                      if any(k in (st.get("Ccd","")+st.get("Cnm","")+st.get("CompN","")).lower() for k in ["champ","europa","confer","uefa"]):
                          OUT.append(print_("DATE", d, st.get("Ccd"), st.get("Scd"), st.get("Cnm"), st.get("Snm"), st.get("CompId"), len(st.get("Events",[]))))
              except Exception as ex:
                  OUT.append(print_("DERR", d, r.status_code, ex))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/*.json repo/samples/ || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
