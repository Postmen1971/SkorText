name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re
          U = [
            "https://api.fupa.net/v1/standings?competition=verbandsliga-wuerttemberg&season=2026-27",
            "https://api.fupa.net/v1/standings?competition=verbandsliga-wuerttemberg&season=2026-27&type=total",
            "https://api.fupa.net/v1/standings?competition=2052&season=2026-27",
            "https://api.fupa.net/v1/standings?competition=verbandsliga-wuerttemberg",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/matches?roundNumber=11",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/matches?round_number=11",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/matches?roundSlug=11",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/matches?rounds=11",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/matches?matchday=11",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/matches?limit=100&page=1",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/matches?from=2026-10-20&to=2026-10-27",
            "https://api.fupa.net/v1/competitions/verbandsliga-wuerttemberg/seasons/2026-27/matches?date=2026-10-24",
          ]
          for u in U:
              try:
                  r = requests.get(u, headers=H, timeout=20)
                  t = r.text
                  OUT.append(print_("SRC", r.status_code, len(t), u))
                  OUT.append("   " + re.sub(r"\s+", " ", t[:250]))
                  try:
                      j = json.loads(t)
                      if isinstance(j, list): OUT.append("   LIST %d rounds %s" % (len(j), sorted(set((x.get("round") or {}).get("number") for x in j if isinstance(x, dict)))))
                  except Exception: pass
                  i = t.find("pping")
                  if i >= 0: OUT.append("   GOEPP@" + str(i) + ": " + re.sub(r"\s+", " ", t[max(0,i-200):i+200]))
                  if r.status_code == 200:
                      fn = "samples/" + re.sub(r"[^a-z0-9]+", "_", u.split("//")[1])[:80] + (".json" if t.lstrip().startswith(("{","[")) else ".html")
                      open(fn, "w").write(t)
              except Exception as ex:
                  OUT.append(print_("SRCERR", u, ex))
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/* repo/samples/ || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
