name: Sofascore-Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Quellen testen
        run: |
          python - <<'PY'
          import requests, json, os
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/html, */*"}
          OUT = []
          def print_(*a): return ' '.join(str(x) for x in a)
          os.makedirs("samples", exist_ok=True)
          import re, collections
          def get(u):
              try:
                  r = requests.get(u, headers=H, timeout=30); return r.status_code, r.text
              except Exception as e: return 0, str(e)
          def save(n, t): open("samples/nl_"+n, "w").write(t)
          def um(q):
              s, t = get("https://match.uefa.com/v5/matches?" + q)
              try:
                  j = json.loads(t); return s, len(t), len(j), [(m.get("competition",{}).get("metaData",{}).get("name"), m.get("kickOffTime",{}).get("date"), m.get("round",{}).get("metaData",{}).get("name"), m.get("status")) for m in j[:2]], t
              except Exception: return s, len(t), 0, t[:200], t
          for q in ["competitionId=2014&seasonYear=2027&fromDate=2026-10-01&toDate=2026-10-08&limit=100&offset=0&order=ASC",
                    "competitionId=2014&seasonYear=2027&limit=100&offset=100&order=ASC",
                    "competitionId=2014&seasonYear=2027&fromDate=2026-11-10&toDate=2026-11-18&limit=100&offset=0&order=ASC",
                    "competitionId=3&seasonYear=2028&limit=3&offset=0&order=ASC",
                    "competitionId=17&seasonYear=2026&limit=3&offset=0&order=ASC",
                    "competitionId=18&seasonYear=2026&limit=3&offset=0&order=ASC",
                    "competitionId=17&seasonYear=2030&limit=3&offset=0&order=ASC",
                    "competitionId=2014&seasonYear=2025&limit=3&offset=0&order=DESC"]:
              r = um(q); OUT.append(print_("UM", q, r[:4]))
              if "fromDate=2026-10-01" in q: save("uefa_oct.json", r[4])
          open('probe-result.txt','w').write('\n'.join(OUT))
          PY
      - uses: actions/checkout@v4
        with:
          path: repo
      - run: |
          cp probe-result.txt repo/probe-result.txt && mkdir -p repo/samples && (cp samples/nl_* repo/samples/ 2>/dev/null || true)
          cd repo && git config user.name Claude && git config user.email noreply@anthropic.com
          git add probe-result.txt samples && git commit -m 'Testergebnis [skip ci]' && git push
